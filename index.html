<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>我的個人網頁</title>
<style>
:root{--bg:#f6f4ef;--card:#fff;--text:#2b2b2b;--muted:#6b6b6b;--accent:#c0392b;--line:#e2ded5}
@media (prefers-color-scheme:dark){:root{--bg:#1b1b1d;--card:#262629;--text:#eee;--muted:#a8a8a8;--accent:#ff7a6b;--line:#3a3a3e}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;line-height:1.7}
header{background:var(--accent);color:#fff;text-align:center;padding:24px 16px}
header h1{margin:0;font-size:1.8rem}
.wrap{overflow:auto;max-width:1100px;margin:0 auto;padding:0 8px 16px}
.menu{float:left;width:20%;padding:8px}
.menu a{display:block;background:var(--card);border:1px solid var(--line);color:var(--text);text-decoration:none;text-align:center;padding:10px;margin-bottom:8px;border-radius:6px}
.menu a:hover{background:var(--accent);color:#fff}
.main{float:left;width:60%;padding:8px 16px}
.right{float:left;width:20%;padding:8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:12px 14px;margin-bottom:12px}
.card h3{margin-top:0}
.main h2{border-left:5px solid var(--accent);padding-left:10px}
img.photo{width:100%;height:auto;border-radius:8px;border:1px solid var(--line)}
.video{position:relative;padding-bottom:56.25%;height:0;border-radius:8px;overflow:hidden}
.video iframe{position:absolute;top:0;left:0;width:100%;height:100%;border:0}
.chartbox{max-width:600px}
a{color:var(--accent)}
footer{clear:both;text-align:center;padding:14px;color:var(--muted);border-top:1px solid var(--line)}
@media (max-width:620px){.menu,.main,.right{width:100%;float:none}.menu{display:flex;flex-wrap:wrap;gap:6px}.menu a{flex:1 1 45%;margin:0}}
</style>
</head>
<body>
<header><h1>Hello World|我的個人網頁</h1><div>網頁設計課程作業</div></header>

<div class="wrap">
  <nav class="menu">
    <a href="#media">影片與照片</a>
    <a href="#chart">統計圖表</a>
    <a href="#friends">同學網站</a>
  </nav>

  <main class="main">
    <h2 id="media">我最喜歡的影片與照片</h2>
    <div class="card">
      <!-- 把 YOUR_VIDEO_ID 換成 YouTube 網址 watch?v= 後面那一串 -->
      <div class="video"><iframe src="https://www.youtube.com/embed/YOUR_VIDEO_ID" title="我最喜歡的影片" allowfullscreen loading="lazy"></iframe></div>
    </div>
    <div class="card">
      <!-- 把照片放進 images 資料夾,命名為 photo.jpg;找不到時會顯示紅色預留圖 -->
      <img class="photo" src="images/photo.jpg" alt="我最喜歡的照片" width="600" height="400"
        onerror="this.onerror=null;this.src='data:image/svg+xml;utf8,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 width=%27600%27 height=%27400%27%3E%3Crect width=%27600%27 height=%27400%27 fill=%27%23c0392b%27/%3E%3Ctext x=%27300%27 y=%27210%27 font-size=%2732%27 fill=%27white%27 text-anchor=%27middle%27%3E請放入 images/photo.jpg%3C/text%3E%3C/svg%3E'">
    </div>

    <h2 id="chart">統計圖表(JavaScript)</h2>
    <div class="card chartbox"><canvas id="myChart"></canvas></div>
  </main>

  <aside class="right">
    <div class="card" id="friends">
      <h3>同學網站</h3>
      <p><a href="https://example.com/classmate1" target="_blank" rel="noopener">同學 A 的網站</a></p>
      <p><a href="https://example.com/classmate2" target="_blank" rel="noopener">同學 B 的網站</a></p>
      <p><a href="https://example.com/classmate3" target="_blank" rel="noopener">同學 C 的網站</a></p>
    </div>
    <div class="card"><h3>關於我</h3><p>在這裡寫一句自我介紹。</p></div>
  </aside>
</div>

<footer>&copy; 2026 我的名字|網頁設計課程作業</footer>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.5.0/dist/chart.umd.min.js"></script>
<script>
var dark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
new Chart(document.getElementById("myChart"),{
  type:"bar",
  data:{labels:["義大利","法國","西班牙","美國","阿根廷"],
        datasets:[{data:[55,49,44,24,15],backgroundColor:["#c0392b","#27ae60","#2980b9","#e67e22","#8e5a3c"]}]},
  options:{plugins:{legend:{display:false},
    title:{display:true,text:"2018 年世界葡萄酒產量(百萬公升)",font:{size:16},color:dark?"#eee":"#2b2b2b"}},
    scales:{x:{ticks:{color:dark?"#ccc":"#444"}},y:{ticks:{color:dark?"#ccc":"#444"}}}}
});
</script>
</body>
</html>
